name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-simulator/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: npm ci
      - name: Install simulator dependencies
        run: npm ci --prefix apps/web-simulator
      - name: Install evaluation validator dependency
        run: python -m pip install jsonschema
      - name: Test backend, scenario helpers, and evaluation registry
        run: npm test
      - name: Verify independent transports and five isolated client processes
        run: node scripts/check-independent-clients.mjs --report /tmp/aura-independent-clients-ci.json
      - name: Test readiness fixtures without requiring an approved real manifest
        run: python3 -B -m unittest discover -s evaluation -p 'test_check_readiness.py'
      - name: Verify seven simulated journey flows
        run: node scripts/check-journey-flow.mjs --report /tmp/aura-journey-ci.json
      - name: Build Core Host
        run: npm run build
      - name: Build Web Simulator
        run: npm --prefix apps/web-simulator run build
      - name: Replay maintained scenarios in fresh processes
        run: npm run scenario:reliability -- --repetitions 1 --report /tmp/aura-scenario-ci.json
      - name: Preserve reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-reliability-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/aura-scenario-ci.json
            /tmp/aura-independent-clients-ci.json
            /tmp/aura-journey-ci.json
          retention-days: 14
          if-no-files-found: warn
