id: safety-override
name: Critical signal interrupts secondary task
description: A critical simulated hazard follows a running secondary task and triggers the local safety supervisor.
timeline:
  - id: start-secondary-task
    atMs: 0
    kind: task.start
    task:
      taskId: passenger-recommendation
      priority: secondary
  - id: critical-hazard
    atMs: 500
    kind: signal
    signal:
      type: safety.hazard
      value:
        severity: CRITICAL
        source: obstacle-distance
      confidence: 0.99
expected:
  initialState:
    fields:
      - path: /activeSafetyWarning
        equals: null
      - path: /activeTasks
        equals: []
  finalState:
    fields:
      - path: /activeSafetyWarning/signalType
        equals: safety.hazard
      - path: /activeSafetyWarning/severity
        equals: critical
      - path: /activeSafetyWarning/signalId
        equals: sim:safety-override:critical-hazard
      - path: /activeTasks/0/taskId
        equals: passenger-recommendation
      - path: /activeTasks/0/status
        equals: interrupted
      - path: /activeTasks/0/interruptionReason
        equals: CRITICAL_SAFETY_SIGNAL_LOCAL_OVERRIDE
  metrics:
    - name: completedSteps
      equals: 2
    - name: signalReceiptCount
      equals: 1
    - name: journeyStopCount
      equals: 0
