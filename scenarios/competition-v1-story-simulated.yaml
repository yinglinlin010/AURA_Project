id: competition-v1-story-simulated
name: Competition V1 journey story (simulation)
description: >-
  Primary story: find a place where it is convenient for Mom to get out, with
  charging nearby. Ask whether entrance proximity or a passenger drop-off
  space matters; infer no age or mobility need. This replay composes supported
  simulation paths: intent routing, rear-to-driver consent, load deferral,
  synthetic parking, one safety interruption, mock voice stop, and offline /
  local / online routing. Display entries assert logical roles and shared
  snapshots only. The DSL executes task recovery with an explicitly simulated
  fixture revalidation result. It does not execute the clarification or
  recommendation comparison. No live provider/network, physical device, real parking sensing,
  wake-word, or latency evidence is produced. Generic place signal freshness
  changes from stale to fresh after simulated reconnection; recommender does
  not consume that signal.
timeline:
  - id: simulated-network-online
    atMs: 0
    kind: signal
    signal:
      type: connectivity.mode
      value: { mode: online, evidence: SIMULATED_CLOUD_AVAILABLE }
  - id: driver-load-normal-initial
    atMs: 50
    kind: signal
    signal:
      type: driver.cognitive_load
      value: { level: normal, confidence: 0.9 }
      confidence: 0.9
  - id: restaurant-request
    atMs: 100
    kind: intent
    text: Find a place where it is convenient for Mom to get out, with charging nearby. Does entrance proximity or a passenger drop-off space matter?
    requestedByRole: front_passenger
    expectedAvailability: cloud
  - id: complex-driving-moment
    atMs: 200
    kind: signal
    signal:
      type: driver.cognitive_load
      value: { level: high, confidence: 0.95 }
      confidence: 0.95
  - id: rear-proposes-drink-stop
    atMs: 300
    kind: command
    displayId: rear-tablet
    command:
      type: action.propose
      payload:
        proposal:
          proposalId: story-drink-stop
          kind: ADD_TRIP_STOP
          summary: Add a nearby drink stop after the restaurant
          targetRole: center
          priority: secondary
          requiresConsent: true
          payload: { placeId: sim:drink-stop, label: Nearby drink stop, category: cafe }
  - id: driver-attention-available
    atMs: 500
    kind: signal
    signal:
      type: driver.cognitive_load
      value: { level: low, confidence: 0.92 }
      confidence: 0.92
  - id: driver-approves-drink-stop
    atMs: 600
    kind: command
    displayId: center-main
    command:
      type: action.consent
      payload: { proposalId: story-drink-stop, decision: approve }
  - id: synthetic-parking-context
    atMs: 700
    kind: perception.parking
    proposalId: story-parking-guidance
    cues: [parking_maneuver_active, repeated_adjustment, unfamiliar_parking_context]
  - id: driver-accepts-parking-guidance
    atMs: 800
    kind: command
    displayId: center-main
    command:
      type: action.consent
      payload: { proposalId: story-parking-guidance, decision: approve }
  - id: start-secondary-task
    atMs: 900
    kind: task.start
    task:
      taskId: story-secondary-task
      priority: secondary
      goal: Find a place where it is convenient for Mom to get out, with charging nearby
      currentStep: Compare simulated drop-off and charging options
      conditions:
        - key: primary-goal
          classification: confirmed
          value: Convenient place for Mom to get out, with charging nearby
          source: simulated
          validForMs: 120000
        - key: entrance-proximity-preference
          classification: unknown
          source: simulated
          validForMs: 120000
  - id: simulated-action-starts
    atMs: 950
    kind: task.action
    taskId: story-secondary-task
    actionId: compare-dropoff-and-charging-options
    idempotencyKey: compare-options-v1
    status: running
    reasonCode: SIMULATED_SCENARIO_ACTION_STARTED
  - id: synthetic-critical-obstacle
    atMs: 1000
    kind: signal
    signal:
      type: safety.critical
      value: { severity: critical, category: obstacle }
      confidence: 1
  - id: reconcile-simulated-action-outcome
    atMs: 1020
    kind: task.action
    taskId: story-secondary-task
    actionId: compare-dropoff-and-charging-options
    idempotencyKey: compare-options-v1
    status: succeeded
    reasonCode: SIMULATED_SCENARIO_OUTCOME_CONFIRMED
    repeatIdempotently: true
  - id: resume-after-simulated-revalidation
    atMs: 1040
    kind: task.resume
    taskId: story-secondary-task
    revalidation:
      reality: simulated
      sourceLabel: scenario-fixture:mom-dropoff-charging
      candidateFresh: true
      capabilityConfirmed: true
      authorizationCurrent: true
      priorActionOutcomeKnown: true
  - id: complete-recovered-task
    atMs: 1060
    kind: task.complete
    taskId: story-secondary-task
    repeatIdempotently: true
  - id: user-invokes-voice
    atMs: 1100
    kind: voice.start
  - id: user-says-stop
    atMs: 1200
    kind: voice.stop
  - id: simulated-network-offline
    atMs: 1300
    kind: signal
    signal:
      type: connectivity.mode
      value: { mode: offline, evidence: SIMULATED_NETWORK_UNAVAILABLE }
  - id: useful-local-request
    atMs: 1400
    kind: intent
    text: Turn cabin volume up
    requestedByRole: center
    expectedAvailability: offline_local
  - id: cached-place-evidence-stale
    atMs: 1450
    kind: signal
    signal:
      type: recommendation.place_evidence
      value: { placeId: sim:drink-stop, detourMinutes: 7 }
      freshness: stale
  - id: simulated-network-recovered
    atMs: 1500
    kind: signal
    signal:
      type: connectivity.mode
      value: { mode: online, evidence: SIMULATED_NETWORK_RESTORED }
  - id: refreshed-place-evidence-fresh
    atMs: 1550
    kind: signal
    signal:
      type: recommendation.place_evidence
      value: { placeId: sim:drink-stop, detourMinutes: 5 }
      freshness: fresh
  - id: cloud-route-recovered
    atMs: 1600
    kind: intent
    text: Find a quiet lunch place near the route
    requestedByRole: center
    expectedAvailability: cloud
expected:
  initialState:
    fields:
      - path: /journey/stops
        equals: []
      - path: /activeSafetyWarning
        equals: null
  finalState:
    fields:
      - path: /journey/stops/0/placeId
        equals: sim:drink-stop
      - path: /connectivity/mode
        equals: online
      - path: /activeSafetyWarning/severity
        equals: critical
  commands:
    - stepId: rear-proposes-drink-stop
      status: RECEIVED
      reasonCode: DRIVER_COGNITIVE_LOAD_HIGH
    - stepId: driver-approves-drink-stop
      status: RECEIVED
      reasonCode: JOURNEY_STOP_ADDED
    - stepId: driver-accepts-parking-guidance
      status: RECEIVED
      reasonCode: TARGET_ROLE_APPROVED
  decisions:
    - stepId: rear-proposes-drink-stop
      proposalId: story-drink-stop
      outcome: DEFER
      reasonCode: DRIVER_COGNITIVE_LOAD_HIGH
      consentRequired: true
    - stepId: driver-attention-available
      proposalId: story-drink-stop
      outcome: ROUTE
      reasonCode: DRIVER_LOAD_BELOW_DEFERRAL_THRESHOLD
    - stepId: driver-approves-drink-stop
      proposalId: story-drink-stop
      outcome: EXECUTE
      reasonCode: CONSENT_GRANTED_POLICY_REVALIDATED
    - stepId: synthetic-parking-context
      proposalId: story-parking-guidance
      outcome: ROUTE
      consentRequired: true
  actions:
    - stepId: rear-proposes-drink-stop
      proposalId: story-drink-stop
      kind: ADD_TRIP_STOP
      targetRole: center
      status: deferred
    - stepId: driver-approves-drink-stop
      proposalId: story-drink-stop
      kind: ADD_TRIP_STOP
      targetRole: center
      status: completed
    - stepId: driver-accepts-parking-guidance
      proposalId: story-parking-guidance
      kind: SHOW_GUIDANCE
      targetRole: center
      status: executing
    - stepId: restaurant-request
      kind: SHOW_INFORMATION
      targetRole: center
      status: routed
    - stepId: useful-local-request
      kind: CHANGE_CABIN_SETTING
      targetRole: center
      status: awaiting_consent
    - stepId: cloud-route-recovered
      kind: SHOW_INFORMATION
      targetRole: center
      status: routed
  displays:
    - { displayId: cluster-main, role: cluster, stateFields: [{ path: /activeSafetyWarning/severity, equals: critical }] }
    - { displayId: center-main, role: center, stateFields: [{ path: /journey/stops/0/placeId, equals: sim:drink-stop }] }
    - { displayId: front-passenger-main, role: front_passenger }
    - { displayId: rear-tablet, role: rear }
    - { displayId: window-tablet, role: interactive_window }
  signalFreshness:
    - { stepId: cached-place-evidence-stale, state: stale }
    - { stepId: refreshed-place-evidence-fresh, state: fresh }
  taskLifecycle:
    - stepId: synthetic-critical-obstacle
      taskId: story-secondary-task
      status: interrupted
      actionCount: 1
      actionStatuses: [unknown]
      completionEventCount: 0
    - stepId: reconcile-simulated-action-outcome
      taskId: story-secondary-task
      status: interrupted
      actionCount: 1
      actionStatuses: [succeeded]
      completionEventCount: 0
    - stepId: resume-after-simulated-revalidation
      taskId: story-secondary-task
      status: running
      actionCount: 1
      actionStatuses: [succeeded]
      completionEventCount: 0
      revalidationReality: simulated
    - stepId: complete-recovered-task
      taskId: story-secondary-task
      status: completed
      actionCount: 1
      actionStatuses: [succeeded]
      completionEventCount: 1
  voice:
    statesAtSteps:
      - { stepId: user-invokes-voice, state: LISTENING }
      - { stepId: user-says-stop, state: IDLE }
    requiredTransitions:
      - { from: IDLE, to: LISTENING }
      - { from: LISTENING, to: IDLE }
