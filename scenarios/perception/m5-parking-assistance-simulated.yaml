id: m5-parking-assistance-simulated
name: Simulated parking assistance offer, deferral, and driver choice
description: >-
  Synthetic parking cues create a Center consent offer. A high-load offer is
  released when load falls below HIGH; one is declined and one is accepted
  into simulator-only guidance. No camera, vehicle, or actuation is involved.
timeline:
  - id: load-high-for-decline
    atMs: 0
    kind: signal
    signal:
      type: driver.cognitive_load
      value: { level: high, confidence: 0.95 }
      confidence: 0.95
  - id: simulated-offer-decline
    atMs: 100
    kind: perception.parking
    proposalId: m5-decline-offer
    cues: [parking_maneuver_active, repeated_adjustment, unfamiliar_parking_context]
  - id: load-normal-release-decline
    atMs: 200
    kind: signal
    signal:
      type: driver.cognitive_load
      value: { level: normal, confidence: 0.95 }
      confidence: 0.95
  - id: driver-declines
    atMs: 300
    kind: command
    displayId: center-main
    command:
      type: action.consent
      payload: { proposalId: m5-decline-offer, decision: decline }
  - id: load-critical-for-consent-offer
    atMs: 400
    kind: signal
    signal:
      type: driver.cognitive_load
      value: { level: critical, confidence: 0.98 }
      confidence: 0.98
  - id: simulated-offer-consent
    atMs: 500
    kind: perception.parking
    proposalId: m5-consent-offer
    cues: [parking_maneuver_active, repeated_adjustment, unfamiliar_parking_context]
  - id: load-low-release-consent
    atMs: 600
    kind: signal
    signal:
      type: driver.cognitive_load
      value: { level: low, confidence: 0.95 }
      confidence: 0.95
  - id: driver-consents-to-simulator-guidance
    atMs: 700
    kind: command
    displayId: center-main
    command:
      type: action.consent
      payload: { proposalId: m5-consent-offer, decision: approve }
expected:
  initialState:
    fields:
      - path: /journey/stops
        equals: []
      - path: /activeSafetyWarning
        equals: null
  finalState:
    fields:
      - path: /activeProposals/0/proposalId
        equals: m5-decline-offer
      - path: /activeProposals/0/status
        equals: declined
      - path: /activeProposals/1/proposalId
        equals: m5-consent-offer
      - path: /activeProposals/1/status
        equals: executing
      - path: /activeProposals/1/consentGranted
        equals: true
      - path: /activeProposals/1/payload/guidanceMode
        equals: simulator_only
      - path: /activeProposals/1/payload/vehicleControlAllowed
        equals: false
      - path: /activeTasks/0/status
        equals: running
      - path: /journey/stops
        equals: []
  commands:
    - stepId: driver-declines
      status: RECEIVED
      reasonCode: TARGET_ROLE_DECLINED
    - stepId: driver-consents-to-simulator-guidance
      status: RECEIVED
      reasonCode: TARGET_ROLE_APPROVED
  decisions:
    - stepId: simulated-offer-decline
      proposalId: m5-decline-offer
      outcome: DEFER
      reasonCode: DRIVER_COGNITIVE_LOAD_HIGH
      consentRequired: true
    - stepId: load-normal-release-decline
      proposalId: m5-decline-offer
      outcome: ROUTE
      reasonCode: DRIVER_LOAD_BELOW_DEFERRAL_THRESHOLD
    - stepId: simulated-offer-consent
      proposalId: m5-consent-offer
      outcome: DEFER
      reasonCode: DRIVER_COGNITIVE_LOAD_HIGH
      consentRequired: true
    - stepId: load-low-release-consent
      proposalId: m5-consent-offer
      outcome: ROUTE
      reasonCode: DRIVER_LOAD_BELOW_DEFERRAL_THRESHOLD
    - stepId: driver-consents-to-simulator-guidance
      proposalId: m5-consent-offer
      outcome: EXECUTE
      reasonCode: CONSENT_GRANTED_POLICY_REVALIDATED
  actions:
    - stepId: driver-declines
      proposalId: m5-decline-offer
      kind: SHOW_GUIDANCE
      targetRole: center
      status: declined
    - stepId: driver-consents-to-simulator-guidance
      proposalId: m5-consent-offer
      kind: SHOW_GUIDANCE
      targetRole: center
      status: executing
  displays:
    - displayId: center-main
      role: center
      stateFields:
        - path: /activeProposals/0/status
          equals: declined
        - path: /activeProposals/1/payload/vehicleControlAllowed
          equals: false
  metrics:
    - name: completedSteps
      equals: 8
    - name: commandReceiptCount
      equals: 2
    - name: signalReceiptCount
      equals: 4
    - name: policyDecisionCount
      equals: 5
    - name: journeyStopCount
      equals: 0
