id: journey-recommendation-deferral
name: Chosen journey stop waits for driver attention
description: SIMULATED whole-journey tradeoff choice; a rear passenger proposal is deferred at high load and only added after low-load driver consent.
timeline:
  - id: driver-busy
    atMs: 0
    kind: signal
    signal:
      type: driver.cognitive_load
      value:
        level: high
        confidence: 0.95
      confidence: 0.95
  - id: rear-proposes-ranked-stop
    atMs: 300
    kind: command
    displayId: rear-tablet
    command:
      type: action.propose
      payload:
        proposal:
          proposalId: journey-stop-001
          kind: ADD_TRIP_STOP
          summary: Add Garden Cafe; better parking and deadline margin despite a lower rating
          targetRole: center
          priority: secondary
          requiresConsent: true
          payload:
            placeId: garden-cafe
            label: Garden Cafe
            category: restaurant
  - id: driver-load-drops
    atMs: 900
    kind: signal
    signal:
      type: driver.cognitive_load
      value:
        level: low
        confidence: 0.92
      confidence: 0.92
  - id: center-approves
    atMs: 1200
    kind: command
    displayId: center-main
    command:
      type: action.consent
      payload:
        proposalId: journey-stop-001
        decision: approve
expected:
  initialState:
    fields:
      - path: /journey/stops
        equals: []
      - path: /activeSafetyWarning
        equals: null
  finalState:
    fields:
      - path: /journey/stops/0/stopId
        equals: journey-stop-001
      - path: /journey/stops/0/placeId
        equals: garden-cafe
      - path: /activeProposals/0/status
        equals: completed
      - path: /activeProposals/0/consentGranted
        equals: true
      - path: /driver/currentLoad
        equals: low
  commands:
    - stepId: rear-proposes-ranked-stop
      status: RECEIVED
      reasonCode: DRIVER_COGNITIVE_LOAD_HIGH
    - stepId: center-approves
      status: RECEIVED
      reasonCode: JOURNEY_STOP_ADDED
  decisions:
    - stepId: rear-proposes-ranked-stop
      proposalId: journey-stop-001
      outcome: DEFER
      reasonCode: DRIVER_COGNITIVE_LOAD_HIGH
      consentRequired: true
    - stepId: driver-load-drops
      proposalId: journey-stop-001
      outcome: ROUTE
      reasonCode: DRIVER_LOAD_BELOW_DEFERRAL_THRESHOLD
    - stepId: center-approves
      proposalId: journey-stop-001
      outcome: EXECUTE
      reasonCode: CONSENT_GRANTED_POLICY_REVALIDATED
  actions:
    - stepId: rear-proposes-ranked-stop
      proposalId: journey-stop-001
      kind: ADD_TRIP_STOP
      targetRole: center
      status: deferred
    - stepId: center-approves
      proposalId: journey-stop-001
      kind: ADD_TRIP_STOP
      targetRole: center
      status: completed
  displays:
    - displayId: center-main
      role: center
      stateFields:
        - path: /journey/stops/0/placeId
          equals: garden-cafe
  metrics:
    - name: completedSteps
      equals: 4
    - name: commandReceiptCount
      equals: 2
    - name: signalReceiptCount
      equals: 2
    - name: policyDecisionCount
      equals: 3
    - name: journeyStopCount
      equals: 1
